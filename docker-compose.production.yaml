services:
  traefik:
    image: traefik:latest
    command:
      - "--api.insecure=true"
      - "--providers.docker=false"
      - "--providers.file.directory=/etc/traefik/dynamic_conf"
      - "--accesslog=true"
      - "--accesslog.fields.headers.defaultmode=keep"
      - "--accesslog.fields.headers.names.User-Agent=drop"
      - "--accesslog.fields.headers.names.Content-Type=drop"
      - "--entryPoints.web.address=:80"
    restart: unless-stopped
    ports:
      - "${ENTRY_PORT}:80"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "./traefik/dynamic_conf_production:/etc/traefik/dynamic_conf"
      - "./traefik/logs:/logs"
    networks:
      - traefik-ingress
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DOMAIN=${DOMAIN}
      - SUB_PATH=${SUB_PATH}

  frontend:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/ecomon-frontend:latest
    # build:
    #   context: ./frontend
    #   dockerfile: Dockerfile
    restart: unless-stopped
    # ports:
    #   - "10300:3000"
    networks:
      - traefik-ingress
    environment:
      - NUXT_PUBLIC_GQL_HOST="${PROTOCOL}://${DOMAIN}${SUB_PATH}/api/v1/graphql"
      - NUXT_PUBLIC_API_BASE_URL=${SUB_PATH}
      - NUXT_PUBLIC_GRAPHQL_CLIENT_CLIENTS_DEFAULT_HOST="${PROTOCOL}://${DOMAIN}${SUB_PATH}/api/v1/graphql"
      - NUXT_PUBLIC_DASHBOARD_URL="${PROTOCOL}://${DOMAIN}${SUB_PATH}/dashboard/"
    env_file:
      - .env

  api:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/ecomon-api:latest
    # build:
    #  context: ./backend
    #  dockerfile: Dockerfile.api
    restart: unless-stopped
    # ports:
    #   - "10800:80"
    networks:
      - traefik-ingress
      - ecomon
    environment:
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - TMP_DIR=/tmp
      - HOST_BASE_DATA_DIRECTORY=${BASE_DATA_DIRECTORY}
      - HOST_TMP_DIR=${TMP_DIR}
    volumes:
      - ${BASE_DATA_DIRECTORY}:/data
      - ${TMP_DIR}:/tmp

  worker:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/ecomon-worker:latest
    # build:
    #  context: ./backend
    #  dockerfile: Dockerfile.worker
    restart: unless-stopped
    networks:
      - ecomon
    environment:
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - TMP_DIR=/tmp
      - HOST_BASE_DATA_DIRECTORY=${BASE_DATA_DIRECTORY}
      - HOST_TMP_DIR=${TMP_DIR}
      - USE_GPU=${USE_GPU}
      - DB_WORKER_CONCURRENCY=${DB_WORKER_CONCURRENCY}
      - INF_WORKER_CONCURRENCY=${INF_WORKER_CONCURRENCY}
    volumes:
      - ${BASE_DATA_DIRECTORY}:/data
      - ${TMP_DIR}:/tmp
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    depends_on:
      - redis

  db:
    image: postgres:16
    shm_size: ${POSTGRES_SHM_SIZE}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ecomon
      POSTGRES_USER: "${DB_USERNAME}"
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
      POSTGRES_ROOT_PASSWORD: "${DB_ROOT_PASSWORD}"
      POSTGRES_DATABASE: "${DB_NAME}"
    ports:
      - "7432:5432"
    deploy:
      resources:
        limits:
          memory: ${POSTGRES_MEMORY_LIMIT}
          cpus: ${POSTGRES_CPU_LIMIT}
        reservations:
          memory: ${POSTGRES_MEMORY_RESERVATION}
          cpus: ${POSTGRES_CPU_RESERVATION}
    command: >
      postgres
      -c shared_buffers=${POSTGRES_SHARED_BUFFERS}
      -c effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE}
      -c maintenance_work_mem=${POSTGRES_MAINTENANCE_WORK_MEM}
      -c work_mem=${POSTGRES_WORK_MEM}
      -c checkpoint_completion_target=${POSTGRES_CHECKPOINT_COMPLETION_TARGET}
      -c wal_buffers=${POSTGRES_WAL_BUFFERS}
      -c default_statistics_target=${POSTGRES_DEFAULT_STATISTICS_TARGET}
      -c random_page_cost=${POSTGRES_RANDOM_PAGE_COST}
      -c effective_io_concurrency=${POSTGRES_EFFECTIVE_IO_CONCURRENCY}
      -c min_wal_size=${POSTGRES_MIN_WAL_SIZE}
      -c max_wal_size=${POSTGRES_MAX_WAL_SIZE}
      -c max_worker_processes=${POSTGRES_MAX_WORKER_PROCESSES}
      -c max_parallel_workers_per_gather=${POSTGRES_MAX_PARALLEL_WORKERS_PER_GATHER}
      -c max_parallel_workers=${POSTGRES_MAX_PARALLEL_WORKERS}
      -c max_parallel_maintenance_workers=${POSTGRES_MAX_PARALLEL_MAINTENANCE_WORKERS}
      -c max_connections=${POSTGRES_MAX_CONNECTIONS}
      -c huge_pages=${POSTGRES_HUGE_PAGES}
      -c log_min_duration_statement=${POSTGRES_LOG_MIN_DURATION_STATEMENT}
      -c autovacuum_work_mem=${POSTGRES_AUTOVACUUM_WORK_MEM}
      -c temp_buffers=${POSTGRES_TEMP_BUFFERS}
      -c checkpoint_timeout=${POSTGRES_CHECKPOINT_TIMEOUT}
    volumes:
      - ${PGDATA_PATH}:/var/lib/postgresql/data
      - ./postgres/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
      - ./postgres/pg_hba.conf:/var/lib/postgresql/data/pg_hba.conf
      - ${PGBACKUP_PATH}:/backup
    env_file:
      - .env
    networks:
      - ecomon

  graphql-engine:
    image: hasura/graphql-engine:v2.38.0-ce
    ports:
      - "10080:8080"
    deploy:
      resources:
        limits:
          memory: ${HASURA_MEMORY_LIMIT}
          cpus: ${HASURA_CPU_LIMIT}
        reservations:
          memory: ${HASURA_MEMORY_RESERVATION}
          cpus: ${HASURA_CPU_RESERVATION}
    restart: unless-stopped
    environment:
      # Database connections
      HASURA_GRAPHQL_METADATA_DATABASE_URL: postgres://${DB_USERNAME}:${DB_PASSWORD}@db:5432/hasura
      PGDATABASE_URL: postgres://${DB_USERNAME}:${DB_PASSWORD}@db:5432/ecomon

      # Console and dev settings
      HASURA_GRAPHQL_ENABLE_CONSOLE: ${HASURA_GRAPHQL_ENABLE_CONSOLE}
      HASURA_GRAPHQL_READ_ONLY_MODE: ${HASURA_GRAPHQL_READ_ONLY_MODE}
      HASURA_GRAPHQL_DEV_MODE: ${HASURA_GRAPHQL_DEV_MODE}
      HASURA_GRAPHQL_ENABLED_LOG_TYPES: ${HASURA_GRAPHQL_ENABLED_LOG_TYPES}

      # Security
      HASURA_GRAPHQL_ADMIN_SECRET: ${HASURA_ADMIN_SECRET}
      HASURA_GRAPHQL_UNAUTHORIZED_ROLE: ${HASURA_GRAPHQL_UNAUTHORIZED_ROLE}

      # Performance tuning
      HASURA_GRAPHQL_CONNECTIONS_PER_READ_REPLICA: ${HASURA_GRAPHQL_CONNECTIONS_PER_READ_REPLICA}
      HASURA_GRAPHQL_STRIPES_PER_READ_REPLICA: ${HASURA_GRAPHQL_STRIPES_PER_READ_REPLICA}
      HASURA_GRAPHQL_POOL_TIMEOUT: ${HASURA_GRAPHQL_POOL_TIMEOUT}
      HASURA_GRAPHQL_CONNECTION_LIFETIME: ${HASURA_GRAPHQL_CONNECTION_LIFETIME}

      # Live queries optimization
      HASURA_GRAPHQL_LIVE_QUERIES_MULTIPLEXED_REFETCH_INTERVAL: ${HASURA_GRAPHQL_LIVE_QUERIES_MULTIPLEXED_REFETCH_INTERVAL}
      HASURA_GRAPHQL_LIVE_QUERIES_MULTIPLEXED_BATCH_SIZE: ${HASURA_GRAPHQL_LIVE_QUERIES_MULTIPLEXED_BATCH_SIZE}

      # Webhooks
      HASURA_WEBHOOKS_BASE_URL: ${HASURA_WEBHOOKS_BASE_URL}
      # HASURA_GRAPHQL_AUTH_HOOK: ${HASURA_WEBHOOKS_BASE_URL}/session
      # HASURA_WEBHOOKS_API_KEY: ${HASURA_API_KEY}
      # HASURA_GRAPHQL_AUTH_HOOK_SEND_REQUEST_BODY: ${HASURA_GRAPHQL_AUTH_HOOK_SEND_REQUEST_BODY}
    depends_on:
      - db
    networks:
      - ecomon
      - traefik-ingress
    env_file:
      - .env

  redis:
    image: redis:alpine
    deploy:
      resources:
        limits:
          memory: ${REDIS_MEMORY_LIMIT}
          cpus: ${REDIS_CPU_LIMIT}
        reservations:
          memory: ${REDIS_MEMORY_RESERVATION}
          cpus: ${REDIS_CPU_RESERVATION}
    command:
      - redis-server
      - --maxmemory
      - ${REDIS_MAXMEMORY}
      - --maxmemory-policy
      - ${REDIS_MAXMEMORY_POLICY}
      - --save
      - ${REDIS_SAVE_INTERVAL}
      - ${REDIS_SAVE_CHANGES}
      - --appendonly
      - ${REDIS_APPENDONLY}
      - --appendfsync
      - ${REDIS_APPENDFSYNC}
      - --tcp-keepalive
      - ${REDIS_TCP_KEEPALIVE}
      - --timeout
      - ${REDIS_TIMEOUT}
      - --tcp-backlog
      - ${REDIS_TCP_BACKLOG}
    container_name: redis
    restart: unless-stopped
    volumes:
      - redis_data:/data  # Redis can use a Docker volume since it's smaller
    networks:
      - ecomon
    env_file:
      - .env

  db-migrate:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/ecomon-hasura-migrate:latest
    # build:
    #  context: ./hasura
    #  dockerfile: Dockerfile.hasura-migrate
    depends_on:
      - db
      - graphql-engine
    environment:
      HASURA_ENDPOINT: "http://graphql-engine:8080"
      HASURA_ADMIN_SECRET: ${HASURA_ADMIN_SECRET}
      APPLY_METADATA: "true"
      APPLY_MIGRATIONS: "true"
      APPLY_SEEDS: "false"
    networks:
      - ecomon
    volumes:
      - ./hasura:/app

  dashboard:
    image: ghcr.io/mfn-berlin/akwamo-webservice-next-dashboard:latest
    ports:
      - "3838:3838"
    environment:
      - HASURA_SECRET=${HASURA_ADMIN_SECRET}
      - HASURA_URL=${HASURA_URL}
    restart: unless-stopped
    # user: "${UID}:${GID}
    networks:
      - traefik-ingress

  airflow:
    image: apache/airflow:2.7.2
    depends_on:
      - db
    environment:
      - AIRFLOW__CORE__SQL_ALCHEMY_CONN=postgresql://${DB_USERNAME}:${DB_PASSWORD}@db:5432/ecomon
      - AIRFLOW_CONN_POSTGRES_DEFAULT=postgresql://${DB_USERNAME}:${DB_PASSWORD}@db:5432/ecomon
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__WEBSERVER__BASE_URL=http://${DOMAIN}${SUB_PATH}/airflow
      - AIRFLOW__WEBSERVER__URL_PATH_PREFIX=/${SUB_PATH}/airflow
      - PG_USER=${DB_USERNAME}
      - PG_PASSWORD=${DB_PASSWORD}
      - PG_HOST=db
      - PG_PORT=5432
      - PG_DATABASE=ecomon
      - MAX_BACKUPS=2
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./.env:/opt/airflow/airflow.env
      - ${BASE_DATA_DIRECTORY}:/data
      - ${PGBACKUP_PATH}:/backup
    user: "0"
    group_add:
      - "1003"  # akwamo
#    ports:
#      - "8282:8080"
#    command: >
#      bash -c "rm -f /opt/airflow/airflow.db &&
#               airflow db init &&
#               airflow users create --username admin --password ${AIRFLOW_ADMIN_PASSWORD} --firstname Admin --lastname User --role Admin --email admin@example.com &&
#               airflow scheduler & airflow webserver"

    command: bash -c "airflow scheduler & airflow webserver"
#   DEBUG
#    entrypoint: /bin/bash
#    command: -c "tail -f /dev/null"
    restart: always
    networks:
      - traefik-ingress
      - ecomon

volumes:
#  ecomon_data:
  redis_data:


networks:
  ecomon:
    driver: bridge
  traefik-ingress:
    driver: bridge
