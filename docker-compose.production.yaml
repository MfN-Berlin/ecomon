services:
  traefik:
    image: traefik:latest
    command:
      - "--api.insecure=true"
      - "--providers.docker=false"
      - "--providers.file.directory=/etc/traefik/dynamic_conf"
      - "--accesslog=true"
      - "--accesslog.fields.headers.defaultmode=keep"
      - "--accesslog.fields.headers.names.User-Agent=drop"
      - "--accesslog.fields.headers.names.Content-Type=drop"
      - "--entryPoints.web.address=:80"
    restart: unless-stopped
    ports:
      - "${ENTRY_PORT}:80"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "./traefik/dynamic_conf_production:/etc/traefik/dynamic_conf"
      - "./traefik/logs:/logs"
    networks:
      - traefik-ingress
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DOMAIN=${DOMAIN}
      - SUB_PATH=${SUB_PATH}

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    # ports:
    #   - "10300:3000"
    networks:
      - traefik-ingress
    environment:
      - NUXT_PUBLIC_GQL_HOST="${PROTOCOL}://${DOMAIN}${SUB_PATH}/api/v1/graphql"
      - NUXT_PUBLIC_API_BASE_URL=${SUB_PATH}
      - NUXT_PUBLIC_GRAPHQL_CLIENT_CLIENTS_DEFAULT_HOST="${PROTOCOL}://${DOMAIN}${SUB_PATH}/api/v1/graphql"
      - NUXT_PUBLIC_DASHBOARD_URL="${PROTOCOL}://${DOMAIN}${SUB_PATH}/dashboard/"
    env_file:
      - .env

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.api
    restart: unless-stopped
    # ports:
    #   - "10800:80"
    networks:
      - traefik-ingress
      - ecomon
    environment:
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - TMP_DIR=/tmp
      - HOST_BASE_DATA_DIRECTORY=${BASE_DATA_DIRECTORY}
      - HOST_TMP_DIR=${TMP_DIR}
    volumes:
      - ${BASE_DATA_DIRECTORY}:/data
      - ${TMP_DIR}:/tmp

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    networks:
      - ecomon
    environment:
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - TMP_DIR=/tmp
      - HOST_BASE_DATA_DIRECTORY=${BASE_DATA_DIRECTORY}
      - HOST_TMP_DIR=${TMP_DIR}
      - USE_GPU=${USE_GPU}
      - DB_WORKER_CONCURRENCY=${DB_WORKER_CONCURRENCY}
      - INF_WORKER_CONCURRENCY=${INF_WORKER_CONCURRENCY}
    volumes:
      - ${BASE_DATA_DIRECTORY}:/data
      - ${TMP_DIR}:/tmp
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    depends_on:
      - redis

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ecomon
      POSTGRES_USER: "${DB_USERNAME}"
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
      POSTGRES_ROOT_PASSWORD: "${DB_ROOT_PASSWORD}"
      POSTGRES_DATABASE: "${DB_NAME}"
    ports:
      - "7432:5432"
    deploy:
      resources:
        limits:
          memory: 32G      # Allocate 32GB to PostgreSQL
          cpus: '8.0'      # Use 8 CPU cores
        reservations:
          memory: 16G      # Reserve at least 16GB
          cpus: '4.0'
    # High-memory PostgreSQL configuration
    command: >
      postgres
      -c shared_buffers=8GB
      -c effective_cache_size=24GB
      -c maintenance_work_mem=2GB
      -c work_mem=256MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=64MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c min_wal_size=2GB
      -c max_wal_size=8GB
      -c max_worker_processes=16
      -c max_parallel_workers_per_gather=8
      -c max_parallel_workers=16
      -c max_parallel_maintenance_workers=8
      -c max_connections=500
      -c huge_pages=try
      -c log_min_duration_statement=1000
    volumes:
#      - ecomon_data:/var/lib/postgresql/data
      - ${PGDATA_PATH}:/var/lib/postgresql/data
      - ./postgres/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    networks:
      - ecomon

  db-migrate:
    build:
      context: ./hasura
      dockerfile: Dockerfile.hasura-migrate
    depends_on:
      - db
      - graphql-engine
    environment:
      HASURA_ENDPOINT: "http://graphql-engine:8080"
      HASURA_ADMIN_SECRET: ${HASURA_ADMIN_SECRET}
      APPLY_METADATA: "true"
      APPLY_MIGRATIONS: "true"
      APPLY_SEEDS: "false"
    networks:
      - ecomon
    volumes:
      - ./hasura:/app

  graphql-engine:
    image: hasura/graphql-engine:v2.38.0-ce
    ports:
       - "10080:8080"
    deploy:
      resources:
        limits:
          memory: 8G
          cpus: '4.0'
    restart: unless-stopped
    environment:
      HASURA_GRAPHQL_METADATA_DATABASE_URL: postgres://${DB_USERNAME}:${DB_PASSWORD}@db:5432/hasura
      PGDATABASE_URL: postgres://${DB_USERNAME}:${DB_PASSWORD}@db:5432/ecomon
      HASURA_GRAPHQL_ENABLE_CONSOLE: "true" # set to "false" to disable console
      HASURA_GRAPHQL_READ_ONLY_MODE: "false"
      HASURA_GRAPHQL_DEV_MODE: "true"
      HASURA_GRAPHQL_ENABLED_LOG_TYPES: startup, http-log, webhook-log, websocket-log, query-log
      HASURA_GRAPHQL_ADMIN_SECRET: ${HASURA_ADMIN_SECRET}
      HASURA_GRAPHQL_UNAUTHORIZED_ROLE: "user" # Allow access without admin secret
      HASURA_WEBHOOKS_BASE_URL: ${HASURA_WEBHOOKS_BASE_URL}
      # HASURA_GRAPHQL_AUTH_HOOK: ${HASURA_WEBHOOKS_BASE_URL}/session
      # HASURA_WEBHOOKS_API_KEY: ${HASURA_API_KEY}
      # HASURA_GRAPHQL_AUTH_HOOK_SEND_REQUEST_BODY: ${HASURA_GRAPHQL_AUTH_HOOK_SEND_REQUEST_BODY}
    depends_on:
      - db
    networks:
      - ecomon
      - traefik-ingress

  redis:
    image: redis:alpine
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2.0'
    command: >
      redis-server
      --maxmemory 3gb
      --maxmemory-policy allkeys-lru
    container_name: redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    # ports:
    #   - "10379:6379"
    networks:
      - ecomon

  dashboard:
    image: ghcr.io/mfn-berlin/akwamo-webservice-next-dashboard:latest
    ports:
      - "3838:3838"
    environment:
      - HASURA_SECRET=${HASURA_ADMIN_SECRET}
      - HASURA_URL=${HASURA_URL}
    restart: unless-stopped
#    user: "${UID}:${GID}
    networks:
      - traefik-ingress

volumes:
#  ecomon_data:
  redis_data:


networks:
  ecomon:
    driver: bridge
  traefik-ingress:
    driver: bridge
