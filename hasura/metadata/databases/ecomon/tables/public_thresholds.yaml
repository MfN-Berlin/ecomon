table:
  name: thresholds
  schema: public
object_relationships:
  - name: label
    using:
      foreign_key_constraint_on: label_id
  - name: model
    using:
      foreign_key_constraint_on: model_id
insert_permissions:
  - role: user
    permission:
      check: {}
      columns:
        - id
        - label_id
        - model_id
        - set_at
        - threshold
        - threshold_type
    comment: ""
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - label_id
        - model_id
        - set_at
        - threshold
        - threshold_type
      filter: {}
    comment: ""
update_permissions:
  - role: user
    permission:
      columns:
        - id
        - label_id
        - model_id
        - set_at
        - threshold
        - threshold_type
      filter: {}
      check: null
    comment: ""
