table:
  name: workflow_reports
  schema: public
select_permissions:
  - role: user
    permission:
      columns:
        - birdid_medium
        - birdid_medium_processed
        - birdid_medium_visible
        - created_at
        - db_import
        - id
        - prefix
        - record_count
        - report_date
        - site_id
        - skipped_records
        - visible_in_ui
        - wav_count
        - wav_size_bytes
      filter: {}
      allow_aggregations: true
    comment: ""
