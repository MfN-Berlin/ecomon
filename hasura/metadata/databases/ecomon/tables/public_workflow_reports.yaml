table:
  name: workflow_reports
  schema: public
select_permissions:
  - role: user
    permission:
      columns:
        - wav_size_bytes
        - visible_in_ui
        - db_import
        - model_name
        - model_status
        - prefix
        - id
        - model_processed
        - model_visible
        - record_count
        - site_id
        - skipped_records
        - wav_count
        - created_at
        - report_date
      filter: {}
      allow_aggregations: true
    comment: ""
