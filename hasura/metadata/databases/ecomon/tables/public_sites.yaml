table:
  name: sites
  schema: public
object_relationships:
  - name: location
    using:
      foreign_key_constraint_on: location_id
array_relationships:
  - name: records
    using:
      foreign_key_constraint_on:
        column: site_id
        table:
          name: records
          schema: public
  - name: sets_sites_selections
    using:
      foreign_key_constraint_on:
        column: site_id
        table:
          name: sets_sites_selections
          schema: public
  - name: site_directories
    using:
      foreign_key_constraint_on:
        column: site_id
        table:
          name: site_directories
          schema: public
  - name: site_reports
    using:
      foreign_key_constraint_on:
        column: site_id
        table:
          name: site_reports
          schema: public
insert_permissions:
  - role: user
    permission:
      check: {}
      columns:
        - prefix
        - location_id
        - name
        - record_regime_pause_duration
        - record_regime_recording_duration
        - remarks
        - sample_rate
    comment: ""
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - location_id
        - sample_rate
        - record_regime_pause_duration
        - record_regime_recording_duration
        - prefix
        - name
        - remarks
        - created_at
        - updated_at
      filter: {}
      allow_aggregations: true
    comment: ""
update_permissions:
  - role: user
    permission:
      columns:
        - prefix
        - location_id
        - name
        - record_regime_pause_duration
        - record_regime_recording_duration
        - remarks
        - sample_rate
      filter: {}
      check: null
    comment: ""
delete_permissions:
  - role: user
    permission:
      filter: {}
    comment: ""
event_triggers:
  - name: site_record_relevant_data_changed
    definition:
      enable_manual: false
      update:
        columns:
          - sample_rate
          - record_regime_pause_duration
          - prefix
    retry_conf:
      interval_sec: 10
      num_retries: 0
      timeout_sec: 60
    webhook: '{{HASURA_WEBHOOKS_BASE_URL}}'
    request_transform:
      body:
        action: transform
        template: |-
          {
            "site_id": {{$body.event.data.new.id}},
            "sample_rate": {{$body.event.data.new.sample_rate}},
            "record_regime_recording_duration": {{$body.event.data.new.record_regime_recording_duration}},
            "prefix": {{$body.event.data.new.prefix}}
          }
      method: POST
      query_params: {}
      template_engine: Kriti
      url: '{{$base_url}}/sites/records-relevant-data-changed'
      version: 2
