table:
  name: model_inference_results
  schema: public
object_relationships:
  - name: label
    using:
      manual_configuration:
        remote_table:
          name: labels
          schema: public
        column_mapping:
          label_id: id
  - name: model
    using:
      manual_configuration:
        remote_table:
          name: models
          schema: public
        column_mapping:
          model_id: id
  - name: record
    using:
      manual_configuration:
        remote_table:
          name: records
          schema: public
        column_mapping:
          record_id: id
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - record_id
        - label_id
        - model_id
        - end_time
        - start_time
        - confidence
        - site_id
      filter: {}
      allow_aggregations: true
    comment: ""