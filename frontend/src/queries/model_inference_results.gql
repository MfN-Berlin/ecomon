query getRecordModelInferenceResults(
  $limit: Int = 10
  $offset: Int = 0
  $order_by: [model_inference_results_view_order_by!] = { start_time: asc }
  $where: model_inference_results_view_bool_exp = {}
) {
  items: model_inference_results_view(where: $where, order_by: $order_by, limit: $limit, offset: $offset) {
    id
    model_id
    model {
      name
    }
    record_id
    label {
      id
      name
    }
    start_time
    end_time
    confidence
  }
  total: model_inference_results_view_aggregate(where: $where) {
    aggregate {
      count
    }
  }
}

query CountMinutesWithActivity(
  $modelId: Int!
  $speciesId: Int!
  $siteId: bigint!
  $threshold: Float!
  $startDate: timestamp!
  $endDate: timestamp!
) {
  model_inference_results_max_confidence(
    where: {
      model_id: { _eq: $modelId }
      label_id: { _eq: $speciesId }
      confidence: { _gte: $threshold }
      record: {
        site_id: { _eq: $siteId }
        record_datetime: {
          _gte: $startDate
          _lt: $endDate
        }
      }
    }
  ) {
    record_id
  }
}

query GetVoucherData(
  $modelId: Int!
  $speciesId: Int!
  $siteId: bigint!
  $threshold: Float!
  $startDate: timestamp!
  $endDate: timestamp!
) {
  model_inference_results_max_confidence(
    where: {
      model_id: { _eq: $modelId }
      label_id: { _eq: $speciesId }
      confidence: { _gte: $threshold }
      record: {
        site_id: { _eq: $siteId }
        record_datetime: {
          _gte: $startDate
          _lt: $endDate
        }
      }
    }
    order_by: [
      { record: { site: { prefix: asc } } },
      { label: { name: asc } },
      { record: { record_datetime: asc } },
      { start_time: asc }
    ]
  ) {
    id
    record_id
    model_id
    label_id
    start_time
    end_time
    confidence
    record {
      id
      record_datetime
      site_id
      filepath
      filename
      duration
      channels
      sample_rate
      mime_type
      site {
        id
        prefix
        name
      }
    }
    label {
      id
      name
    }
    model {
      id
      name
    }
  }
}